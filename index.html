<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flame-Chaser's Path: Thermodynamics</title>
    <link rel="stylesheet" href="style.css">
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            startup: { typeset: false },
            chtml: { 
                scale: 1,
                minScale: 0.8,
                displayAlign: 'left'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <!-- Dynamic Glitter Overlay & Animated Background Elements -->
    <div id="ambient-nebula-1" class="nebula"></div>
    <div id="ambient-nebula-2" class="nebula"></div>
    <div id="ambient-nebula-3" class="nebula"></div>
    <div id="glitter-container"></div>
    
    <!-- TV Scanline Overlay (Hidden by default, triggered randomly) -->
    <div id="scanline-overlay" class="hidden"></div>

    <!-- Persistent Top Controls -->
    <div class="top-controls">
        <button id="fullscreen-btn" class="audio-control">
            <svg id="icon-fs-enter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M3 5.25a2.25 2.25 0 0 1 2.25-2.25h4.5a.75.75 0 0 1 0 1.5H5.25a.75.75 0 0 0-.75.75v4.5a.75.75 0 0 1-1.5 0v-4.5Zm18 0a2.25 2.25 0 0 0-2.25-2.25h-4.5a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 0 1.5 0v-4.5Zm-18 13.5a2.25 2.25 0 0 0 2.25 2.25h4.5a.75.75 0 0 0 0-1.5H5.25a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-1.5 0v4.5Zm18 0a2.25 2.25 0 0 1-2.25 2.25h-4.5a.75.75 0 0 1 0-1.5h4.5a.75.75 0 0 0 .75-.75v-4.5a.75.75 0 0 1 1.5 0v4.5Z" clip-rule="evenodd" /></svg>
            <svg id="icon-fs-exit" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8.25 3a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-.75.75H4.5a.75.75 0 0 1 0-1.5h3v-3a.75.75 0 0 1 .75-.75Zm7.5 0a.75.75 0 0 1 .75.75v3h3a.75.75 0 0 1 0 1.5h-3.75a.75.75 0 0 1-.75-.75V3.75A.75.75 0 0 1 15.75 3ZM8.25 15.75a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0v-3h-3a.75.75 0 0 1 0-1.5h3.75Zm7.5 0a.75.75 0 0 1 .75.75h3.75a.75.75 0 0 1 0 1.5h-3v3a.75.75 0 0 1-1.5 0v-3.75A.75.75 0 0 1 15.75 15.75Z" clip-rule="evenodd" /></svg>
        </button>

        <button id="mute-btn" class="audio-control">
            <svg id="icon-unmuted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z" /><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z" /></svg>
            <svg id="icon-muted" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM17.78 9.22a.75.75 0 1 0-1.06 1.06L18.44 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 1 0 1.06-1.06L20.56 12l1.72-1.72a.75.75 0 1 0-1.06-1.06l-1.72 1.72-1.72-1.72Z" /></svg>
        </button>
    </div>

    <!-- Audio Elements (Force unmuted autoplay) -->
    <audio id="audio-intro" src="intro.mp3" loop preload="auto" autoplay></audio>
    <audio id="audio-aura" src="aura.mp3" loop preload="auto"></audio>

    <!-- AHA EVENT ELEMENTS -->
    <div id="aha-mask-container" class="hidden">
        <img id="aha-mask" src="aha.png" alt="Aha Mask">
        <div id="aha-exclamation" class="hidden">!</div>
    </div>
    
    <!-- AHA HACK SCREEN -->
    <div id="aha-hack-screen" class="hidden">
        <div id="aha-terminal"></div>
        <div id="aha-input-container" class="hidden">
            <span class="prompt">Do you believe Aha was here? [Y/N] </span>
            <input type="text" id="aha-input" maxlength="1" autocomplete="off" autofocus>
        </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="main-screen" class="screen active">
        <div class="book-cover">
            <div class="attempts-badge">Cycle: <span class="attempt-display">0</span></div>
            <h1 class="glow-text">Flame-Chaser's Path:<br>Thermodynamics</h1>
            <button id="start-btn" class="hsr-btn">Begin Trial</button>
        </div>
    </div>

    <!-- NAME DIALOG OVERLAY -->
    <div id="name-dialog" class="overlay hidden">
        <div class="dialog-box">
            <h2>Enter your Name, Trailblazer</h2>
            <input type="text" id="student-name" placeholder="Student Name" autocomplete="off">
            <button id="submit-name-btn" class="hsr-btn">Submit</button>
        </div>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question-screen" class="screen hidden">
        <div class="book-container">
            <div class="attempts-badge">Cycle: <span class="attempt-display">0</span></div>
            <!-- Left Page -->
            <div class="page left-page">
                <div class="question-header">
                    <span id="question-number">Question 1/X</span>
                </div>
                <div id="question-text">
                    <!-- Question goes here -->
                </div>
                
                <div id="feedback-container" class="hidden">
                    <h3>Explanation:</h3>
                    <div id="feedback-text-wrapper">
                        <p id="feedback-text"></p>
                    </div>
                </div>
            </div>
            
            <!-- Right Page -->
            <div class="page right-page">
                <div id="choices-container" class="choices-stack">
                    <!-- Choices go here -->
                </div>
                
                <div class="nav-container">
                    <button id="next-btn" class="hsr-btn hidden">Next Question</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCORE SCREEN -->
    <div id="score-screen" class="screen hidden">
        <div class="score-card">
            <div class="attempts-badge">Cycle: <span class="attempt-display">0</span></div>
            <h2 id="score-student-name">Traveler's</h2>
            <h2 id="score-title-text">Flame-Chaser Path is</h2>
            <h1 id="path-name" class="glow-text path-glow">Path Name</h1>
            <h3 id="score-display">0 / 0</h3>
            
            <img id="path-logo" src="" alt="Path Logo" class="pulse-anim">
            
            <div class="flavor-text-container">
                <p id="flavor-text"></p>
            </div>
            
            <div id="debug-controls" class="hidden" style="margin-top:20px;">
                <p style="color:#d4af37; font-size:0.9rem;">[Debug Mode Active - Use Left/Right Arrows to Cycle Paths]</p>
            </div>

            <button id="restart-btn" class="hsr-btn" style="margin-top: 20px;">Return to the Start</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
